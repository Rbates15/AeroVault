<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 36" fill="none" role="img" aria-label="AeroVault">
  <title>AeroVault</title>

  <!-- ── Icon mark: shield with wing sweep ─────────────────────────────── -->
  <!-- Shield body -->
  <path
    d="M4 4.5 C4 4.5 18 2 18 2 C18 2 32 4.5 32 4.5 L32 20 C32 27 18 33 18 33 C18 33 4 27 4 20 Z"
    fill="#0f1629"
    stroke="#3b82f6"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <!-- Wing sweep line through shield — single clean stroke -->
  <path
    d="M8 22 C11 19 14 16 18 14.5 C22 13 26 13.5 30 11"
    stroke="#3b82f6"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Small accent dot at wing tip -->
  <circle cx="30" cy="11" r="1.5" fill="#3b82f6"/>

  <!-- ── Wordmark: "AeroVault" ──────────────────────────────────────────── -->
  <!--
    Using SVG text with a system font stack rather than drawn paths.
    This ensures correct letterforms, weight, and spacing across platforms
    without any external font dependency. The font-family matches
    the Tailwind system stack defined in tailwind.config.js.
  -->
  <text
    x="42"
    y="24"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="-0.3"
    fill="#f1f5f9"
  >Aero</text>
  <text
    x="88"
    y="24"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="-0.3"
    fill="#3b82f6"
  >Vault</text>
</svg>
